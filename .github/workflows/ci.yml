name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev + report extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

      - name: Render demo report (smoke-tests the WOW artifact)
        run: firstflight report --demo --out-dir bench/reports

      - name: Upload demo report (so any CI run shows the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-py${{ matrix.python-version }}-${{ github.run_id }}
          path: bench/reports/**
          if-no-files-found: ignore
