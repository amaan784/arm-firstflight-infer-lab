# Free, reproducible Arm execution judges can inspect straight from CI.
#
# Runs on GitHub-hosted Arm runners (ubuntu-24.04-arm, GA and free for public repos, verified
# 2026-06-26: https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/).
#
# Two jobs:
#   smoke-arm              every push: real inference + baseline prefill sweep + report.
#   kleidiai-before-after  the headline: builds llama.cpp three ways (a GENERIC armv8-a floor
#                          with repack+native OFF, the native+repack default, and KleidiAI),
#                          runs the attribution ladder + quality guardrail + KleidiAI-active
#                          detection, renders the report.
# Both write the report INTO THE RUN SUMMARY (no artifact download needed to see results)
# and upload the full HTML report + JSON results as an artifact.

name: arm-bench

on:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp release tag (b9873 verified 2026-07-05; tags float)"
        default: "b9873"
        type: string
      run_quant_sweep:
        description: "Also run the secondary sweeps (quant / KV-cache / ubatch / build-flags)"
        default: true
        type: boolean
      rounds:
        description: "Interleaved rounds for the KleidiAI ladder (1 = fast calibration run)"
        default: "3"
        type: string
  push:
    branches: [main]
    paths: ["src/**", "configs/**", ".github/workflows/arm-bench.yml"]

permissions:
  contents: read

env:
  LLAMA_TAG: ${{ github.event.inputs.llama_tag || 'b9873' }}

jobs:
  smoke-arm:
    name: smoke + baseline sweep (prebuilt llama.cpp)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Runtime libs (GNU time gives per-process peak RSS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 time libcurl4t64 || sudo apt-get install -y libgomp1 time libcurl4

      - name: Install firstflight
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[report,hub]"

      - name: Fetch prebuilt llama.cpp (our own bootstrap command)
        run: firstflight setup-engine --tag "$LLAMA_TAG"

      # HF throttles repeat pulls from runner IPs (observed 2-8MB/s). Cache the GGUFs so a
      # download only ever has to succeed once; save even when a later step fails.
      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('configs/models.yaml') }}-${{ github.run_id }}
          restore-keys: |
            models-v2-${{ hashFiles('configs/models.yaml') }}-

      - name: Environment report
        run: firstflight info

      - name: Remove committed synthetic examples (real runs must stay pure)
        run: rm -f bench/results/example_*.json bench/results/profile_example.json

      # Its own step so a slow HF transfer is visible as a download rather than looking like
      # a hung benchmark, and so the cache save below banks it even if smoke later fails.
      - name: Pre-download the smoke model (resumable, retried)
        run: |
          firstflight download
          ls -lh models/

      - name: Save model cache early (bank the download before inference)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('configs/models.yaml') }}-${{ github.run_id }}

      - name: Smoke (real inference on Arm)
        # Model is already cached by the step above, so this is load + 24 tokens.
        run: firstflight smoke --timeout 180

      - name: Baseline prefill sweep (light workload — this job runs on every push)
        run: firstflight bench --label baseline --workload rag-context --repetitions 2

      - name: Render report (priced at this runner's $0/hr, not a paid instance)
        run: firstflight report --instance github-arm-runner

      - name: Publish report to the run summary
        run: |
          if compgen -G 'bench/reports/*.md' > /dev/null; then
            f=$(ls -t bench/reports/*.md | head -1)
            # strip local-image lines (the summary can't load repo-relative PNGs)
            grep -v '^!\[' "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Charts + standalone HTML report: see this run's artifact._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was generated (all measurement steps skipped?)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save model cache (even on failure — a good download must only happen once)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('configs/models.yaml') }}-${{ github.run_id }}

      - name: Upload results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-smoke-${{ github.run_id }}
          path: |
            bench/results/**
            bench/reports/**
          if-no-files-found: ignore

  kleidiai-before-after:
    name: "headline: KleidiAI attribution ladder (three builds, same model, same host)"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git time libcurl4-openssl-dev

      # Bin dirs only (the workflow and find_binary only need build/bin), and an explicit
      # save with if:always() — run #6 built all three variants successfully, then failed on
      # a benchmark step, and the default cache post-step skipped the save. Never again:
      # a completed build gets banked no matter what happens later in the job.
      - name: Restore llama.cpp builds
        uses: actions/cache/restore@v4
        with:
          path: |
            llama-generic/build/bin
            llama-baseline/build/bin
            llama-kleidiai/build/bin
          key: llama-builds-${{ env.LLAMA_TAG }}-v4-${{ github.run_id }}
          restore-keys: |
            llama-builds-${{ env.LLAMA_TAG }}-v4-

      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('configs/models.yaml') }}-${{ github.run_id }}
          restore-keys: |
            models-v2-${{ hashFiles('configs/models.yaml') }}-

      # ttft/throughput need llama-server + llama-batched-bench from the kleidiai build.
      # Keep them in the target list or those steps silently skip.
      #
      # Why three builds (flag names + defaults verified against the pinned tag's
      # ggml/CMakeLists.txt, 2026-08-08):
      #   GENERIC   GGML_NATIVE=OFF GGML_CPU_ARM_ARCH=armv8-a GGML_CPU_REPACK=OFF
      #             GGML_CPU_KLEIDIAI=OFF — the true unaccelerated floor. A plain Release
      #             build is NOT a floor: GGML_NATIVE and GGML_CPU_REPACK default ON.
      #   BASELINE  plain Release = native targeting + ggml's own aarch64 Q4_0 repack GEMM.
      #   KLEIDIAI  baseline + -DGGML_CPU_KLEIDIAI=ON (Arm's kernels replace the repack path).
      - name: Build llama.cpp GENERIC (armv8-a floor, repack+native OFF)
        run: |
          set -euxo pipefail
          if [ ! -e llama-generic/build/bin/llama-bench ] || [ ! -e llama-generic/build/bin/llama-completion ] || [ ! -e llama-generic/build/bin/llama-perplexity ]; then
            rm -rf llama-generic
            git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git llama-generic
            cmake -S llama-generic -B llama-generic/build -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a -DGGML_CPU_REPACK=OFF -DGGML_CPU_KLEIDIAI=OFF
            cmake --build llama-generic/build --config Release -j"$(nproc)" --target llama-bench llama-completion llama-perplexity
          else
            echo "cache hit - reusing llama-generic build"
          fi

      - name: Build llama.cpp BASELINE (default Release = native + aarch64 repack)
        run: |
          set -euxo pipefail
          if [ ! -e llama-baseline/build/bin/llama-bench ] || [ ! -e llama-baseline/build/bin/llama-completion ] || [ ! -e llama-baseline/build/bin/llama-server ] || [ ! -e llama-baseline/build/bin/llama-perplexity ]; then
            rm -rf llama-baseline
            git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git llama-baseline
            cmake -S llama-baseline -B llama-baseline/build -DCMAKE_BUILD_TYPE=Release
            cmake --build llama-baseline/build --config Release -j"$(nproc)" --target llama-bench llama-completion llama-server llama-batched-bench llama-perplexity
          else
            echo "cache hit - reusing llama-baseline build"
          fi

      - name: Build llama.cpp KLEIDIAI (-DGGML_CPU_KLEIDIAI=ON)
        run: |
          set -euxo pipefail
          if [ ! -e llama-kleidiai/build/bin/llama-bench ] || [ ! -e llama-kleidiai/build/bin/llama-completion ] || [ ! -e llama-kleidiai/build/bin/llama-server ] || [ ! -e llama-kleidiai/build/bin/llama-batched-bench ] || [ ! -e llama-kleidiai/build/bin/llama-perplexity ]; then
            rm -rf llama-kleidiai
            git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git llama-kleidiai
            cmake -S llama-kleidiai -B llama-kleidiai/build -DCMAKE_BUILD_TYPE=Release -DGGML_CPU_KLEIDIAI=ON
            cmake --build llama-kleidiai/build --config Release -j"$(nproc)" --target llama-bench llama-completion llama-server llama-batched-bench llama-perplexity
          else
            echo "cache hit - reusing llama-kleidiai build"
          fi

      - name: Install firstflight
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[report,hub]"

      - name: Remove committed synthetic examples (real runs must stay pure)
        run: rm -f bench/results/example_*.json bench/results/profile_example.json

      # Fetch every model the ladder needs BEFORE benchmarking, so a throttled HF response
      # fails on its own line instead of looking like a benchmark failure, and so the cache
      # save below banks the download even if a later step dies.
      - name: Pre-download models (resumable, retried)
        run: |
          firstflight download --model qwen2.5-0.5b-instruct --variant q4_0
          firstflight download --model qwen2.5-0.5b-instruct --variant q4_k_m
          firstflight download --model qwen2.5-1.5b-instruct --variant q4_0
          firstflight download --model qwen2.5-1.5b-instruct --variant q8_0
          firstflight download --model qwen2.5-1.5b-instruct --variant q4_k_m
          ls -lh models/

      - name: Save model cache early (bank the downloads before benchmarking)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('configs/models.yaml') }}-${{ github.run_id }}

      - name: "Noise floor: same build twice (ctrl-a vs ctrl-b) — the honesty yardstick"
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight experiment --name noise-floor --no-report --no-quality

      - name: "Experiment: KleidiAI attribution ladder (generic → repack → KleidiAI) + quality"
        env:
          LLAMA_GENERIC_BIN: ${{ github.workspace }}/llama-generic/build
          LLAMA_BASELINE_BIN: ${{ github.workspace }}/llama-baseline/build
          LLAMA_KLEIDIAI_BIN: ${{ github.workspace }}/llama-kleidiai/build
        # Interleaved rounds (A,B,C,A,B,C,...) so runner drift can't masquerade as a
        # treatment effect; the report medians per rung and shows the between-round spread.
        run: firstflight experiment --name kleidiai --no-report --rounds "${{ github.event.inputs.rounds || '3' }}"

      # ttft + throughput run EARLY (right after the ladder): they are unique evidence with
      # no fallback, so an overtime cancel must lose the secondary sweeps below, not these.
      - name: "Measured TTFT: prompt-cache cold vs warm (llama-server --cache-reuse, Q4_0)"
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight ttft --prefix-tokens 2048 --variant q4_0

      - name: "Concurrency: aggregate tok/s at 1/2/4/8 parallel requests (Q4_0)"
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight throughput --prompt-tokens 1024 --levels 1,2,4,8 --variant q4_0

      - name: "Experiment: build targeting — generic armv8-a vs native(+repack)"
        if: ${{ github.event.inputs.run_quant_sweep != 'false' }}
        env:
          LLAMA_GENERIC_BIN: ${{ github.workspace }}/llama-generic/build
          LLAMA_BASELINE_BIN: ${{ github.workspace }}/llama-baseline/build
        run: firstflight experiment --name build-flags --no-report --no-quality

      # The Q4_0 ladder understates KleidiAI: ggml's repack rung already owns most of the
      # Q4_0 headroom. Q8_0 is where KleidiAI's own kernels have room to show a clean delta.
      - name: "Experiment: the ladder again at Q8_0 (where KleidiAI's delta isn't pre-eaten)"
        if: ${{ github.event.inputs.run_quant_sweep != 'false' }}
        env:
          LLAMA_GENERIC_BIN: ${{ github.workspace }}/llama-generic/build
          LLAMA_BASELINE_BIN: ${{ github.workspace }}/llama-baseline/build
          LLAMA_KLEIDIAI_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight experiment --name kleidiai-q8_0 --no-report --no-quality

      # Deliberate negative control: run the KleidiAI build against Q4_K_M, which its kernels
      # cannot touch. The probe must report KleidiAI INACTIVE and the report must refuse to
      # credit KleidiAI for any measured difference. This is the harness catching a false claim.
      - name: "Negative control: KleidiAI build on Q4_K_M (kernels must NOT engage)"
        if: ${{ github.event.inputs.run_quant_sweep != 'false' }}
        env:
          LLAMA_BASELINE_BIN: ${{ github.workspace }}/llama-baseline/build
          LLAMA_KLEIDIAI_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight experiment --name kleidiai-null-control --no-report --no-quality

      - name: "Experiment: quant sweep (Q8_0 / Q4_K_M / Q4_0)"
        if: ${{ github.event.inputs.run_quant_sweep != 'false' }}
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight experiment --name quant-sweep --no-report

      - name: "Experiment: KV-cache f16 vs q8_0 (-ctk/-ctv, FA pinned on)"
        if: ${{ github.event.inputs.run_quant_sweep != 'false' }}
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight experiment --name kv-cache --no-report

      - name: "Experiment: prefill micro-batch sweep (-ub 256..2048)"
        if: ${{ github.event.inputs.run_quant_sweep != 'false' }}
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: firstflight experiment --name prefill-batch --no-report --no-quality

      - name: "Performix hotspots (needs apx on the runner; skip is reported, not hidden)"
        env:
          LLAMA_CPP_BIN: ${{ github.workspace }}/llama-kleidiai/build
        run: |
          firstflight profile --no-download || \
            echo "_Performix step did not produce hotspots (apx unavailable on this runner) — see docs/RUNBOOK.md section D for the VM path._" >> "$GITHUB_STEP_SUMMARY"

      - name: Save llama.cpp builds (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            llama-generic/build/bin
            llama-baseline/build/bin
            llama-kleidiai/build/bin
          key: llama-builds-${{ env.LLAMA_TAG }}-v4-${{ github.run_id }}

      - name: Save model cache (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('configs/models.yaml') }}-${{ github.run_id }}

      - name: Render the combined report (priced at this runner's $0/hr)
        run: firstflight report --instance github-arm-runner

      - name: Publish report to the run summary
        run: |
          if compgen -G 'bench/reports/*.md' > /dev/null; then
            f=$(ls -t bench/reports/*.md | head -1)
            grep -v '^!\[' "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Charts + standalone HTML report: see this run's artifact._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was generated (all measurement steps skipped?)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-headline-${{ github.run_id }}
          path: |
            bench/results/**
            bench/reports/**
          if-no-files-found: ignore
