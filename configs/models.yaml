# Model registry for Arm FirstFlight Infer Lab.
#
# Each model lists GGUF quant variants by name. The smoke model is tiny and downloads in
# seconds so the pipeline can be proven end-to-end on any machine. The larger models are for
# the real Arm benchmarks (CI uses the smoke model; a remote Arm VM can use bigger).
#
# `url` is a direct HTTPS download (Hugging Face "resolve" link). `sha256` is optional; fill
# it in after the first download.
#
# Smoke URLs verified live 2026-06-26: the official Qwen GGUF repo uses ALL-LOWERCASE
# filenames (q4_k_m, q8_0, fp16) and the resolve URLs return real binaries.
#
# KleidiAI (matters for the kleidiai/quant experiments): Arm's int4/int8 microkernels in
# current llama.cpp accelerate ONLY Q4_0 and Q8_0 weights, NOT Q4_K_M / k-quants. They repack
# plain Q4_0/Q8_0 tensors at load time (the old on-disk Q4_0_4_4 / Q4_0_4_8 / Q4_0_8_8 formats
# were removed upstream and no longer load). So "KleidiAI on vs off" must use a Q4_0 model.
# See METHODOLOGY.md. KleidiAI is active if llama.cpp's load output has:
#     load_tensors: CPU_KLEIDIAI model buffer size = ... MiB

default_smoke: qwen2.5-0.5b-instruct
default_smoke_variant: q4_k_m

models:
  qwen2.5-0.5b-instruct:
    hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    description: "Qwen2.5 0.5B Instruct — smoke / CI default (Apache-2.0). Has all three quant axes."
    variants:
      q4_0:
        file: qwen2.5-0.5b-instruct-q4_0.gguf
        url: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf"  # verified 2026-07-07 (GGUF magic + 428MB)
        min_bytes: 400000000        # ~428 MB verified; below this the file is truncated
        sha256: ""
      q4_k_m:
        file: qwen2.5-0.5b-instruct-q4_k_m.gguf
        url: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"  # verified 2026-06-26
        min_bytes: 460000000        # ~491 MB (468.6 MiB) observed on download
        sha256: ""
      q8_0:
        file: qwen2.5-0.5b-instruct-q8_0.gguf
        url: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf"  # verified 2026-06-26
        sha256: ""

  # bartowski build of the same 0.5B model. Alternative source for the Q4_0 quant (the
  # KleidiAI-accelerated path) used by the kleidiai experiment.
  qwen2.5-0.5b-instruct-bartowski:
    hf_repo: bartowski/Qwen2.5-0.5B-Instruct-GGUF
    description: "Qwen2.5 0.5B Instruct (bartowski) — provides the Q4_0 KleidiAI path."
    variants:
      q4_0:
        file: Qwen2.5-0.5B-Instruct-Q4_0.gguf
        url: "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_0.gguf"  # TODO(confirm) exact file present
        sha256: ""
      q4_k_m:
        file: Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
        url: "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"  # verified 2026-06-26
        sha256: ""
      q8_0:
        file: Qwen2.5-0.5B-Instruct-Q8_0.gguf
        url: "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q8_0.gguf"  # verified 2026-06-26
        sha256: ""

  # Larger model for headline runs: 32k context on a 0.5B is an odd regime, so run the real
  # before/after here where the TTFT pain is realistic. Same family/tokenizer as the smoke
  # model, which also opens the door to a speculative-decoding pairing later.
  qwen2.5-1.5b-instruct:
    hf_repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    description: "Qwen2.5 1.5B Instruct — headline-run target (all URLs verified 2026-07-30, GGUF magic + sizes)."
    variants:
      q4_0:
        file: qwen2.5-1.5b-instruct-q4_0.gguf
        url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_0.gguf"  # verified 2026-07-30 (1.07 GB)
        min_bytes: 1000000000       # ~1.07 GB verified
        sha256: ""
      q4_k_m:
        file: qwen2.5-1.5b-instruct-q4_k_m.gguf
        url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"  # verified 2026-07-30 (1.12 GB)
        min_bytes: 1050000000       # ~1.12 GB verified
        sha256: ""
      q8_0:
        file: qwen2.5-1.5b-instruct-q8_0.gguf
        url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q8_0.gguf"  # verified 2026-07-30 (1.89 GB)
        min_bytes: 1800000000       # ~1.89 GB verified
        sha256: ""
  # Even larger (3B+) targets: verify URLs the same way before adding (ranged GET, GGUF magic).
